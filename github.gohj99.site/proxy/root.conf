# GitHub proxy website configuration for 1Panel/OpenResty
# This file is included inside the github.gohj99.site server{} context.

# Block repository/configuration files and internal directories
location ~* ^/(?:\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime|vendor|__pycache__)(?:/|$) {
    return 404;
}

location ~* ^/(login|signup|session|logout|settings|account|notifications|new|import|authorize|organizations/plan|marketplace)(?:/|$) {
    return 404;
}

location ~* (^|/)proxy_cache_dir(?:/|$) {
    return 403;
}

# Keep ACME validation available for 1Panel certificate renewal
location ^~ /.well-known/acme-challenge/ {
    allow all;
    root /usr/share/nginx/html;
}

location ~ ^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$ {
    return 403;
}

# Main host: local homepage. Other proxy hosts go upstream at /
location = / {
    try_files $gh_homepage_file @ghfast_backend;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
}

location = /favicon.ico {
    try_files $uri @ghfast_backend;
    access_log off;
    log_not_found off;
}

location = /robots.txt {
    try_files $uri @ghfast_backend;
    access_log off;
}

location = /static/content-blocked.html {
    try_files $uri @ghfast_backend;
    access_log off;
}

location = /static/github-hook.js {
    try_files $uri @ghfast_backend;
    access_log off;
}

# Smart URL redirect without relying on a named capture variable
location ~ ^/https?://[^/]+(/.*)?$ {
    if ($gh_redirect_subdomain = "") {
        return 404;
    }

    return 301 https://$gh_redirect_subdomain$1$is_args$args;
}

# Local files first, then GitHub upstream
location / {
    try_files $uri $uri/ @ghfast_backend;
}

location @ghfast_backend {
    # DNS resolver for GitHub backend, using Google's public IPv6 DNS servers
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 10s;

    proxy_pass $gh_backend;

    proxy_set_header Host $gh_backend_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header REMOTE-HOST $remote_addr;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;

    proxy_set_header Authorization $gh_authorization;
    proxy_set_header Cookie $gh_cookie;
    proxy_set_header Accept-Encoding "";

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_buffer_size 256k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 512k;
    proxy_temp_file_write_size 512k;

    proxy_ssl_server_name on;
    proxy_ssl_name $gh_backend_host;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # Partitioned cache. API/GHCR credentials, signed URLs, Gist pages and
    # mutable archive refs are bypassed by the maps in the global file.
    proxy_cache $gh_cache_zone;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$host$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_bypass $gh_skip_risky_cache $gh_api_skip_cache;
    proxy_no_cache $gh_skip_risky_cache $gh_api_skip_cache;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;
    proxy_cache_valid 200 206 10m;
    proxy_cache_valid 301 1h;
    proxy_cache_valid 404 1m;
    proxy_cache_valid 403 30s;
    proxy_cache_valid 500 502 503 504 0;

    add_header X-Cache $upstream_cache_status always;

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Server;
    proxy_hide_header X-GitHub-Request-Id;

    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; img-src * data: blob:; style-src 'unsafe-inline' 'self' https:; script-src 'unsafe-inline' 'unsafe-eval' 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Requires ngx_http_sub_module, included by normal OpenResty builds.
    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript application/json;

    sub_filter "github.com" "github.gohj99.site";
    sub_filter "api.github.com" "api.github.gohj99.site";
    sub_filter "raw.githubusercontent.com" "raw.github.gohj99.site";
    sub_filter "camo.githubusercontent.com" "camo.github.gohj99.site";
    sub_filter "docs.github.com" "docs.github.gohj99.site";
    sub_filter "gist.github.com" "gist.github.gohj99.site";
    sub_filter "github.githubassets.com" "assets.github.gohj99.site";
    sub_filter "avatars.githubusercontent.com" "avatars.github.gohj99.site";
    sub_filter "objects.githubusercontent.com" "objects.github.gohj99.site";
    sub_filter "codeload.github.com" "codeload.github.gohj99.site";
    sub_filter "ghcr.io" "ghcr.github.gohj99.site";
    sub_filter "gist-assets.githubusercontent.com" "gist-assets.github.gohj99.site";
    sub_filter "user-images.githubusercontent.com" "user-images.github.gohj99.site";
    sub_filter "private-user-images.githubusercontent.com" "private-user-images.github.gohj99.site";
    sub_filter "release-assets.githubusercontent.com" "release-assets.github.gohj99.site";
    sub_filter "github-releases.githubusercontent.com" "github-releases.github.gohj99.site";
    # Inject the content guard at the beginning of <head> so it starts
    # loading before the page body and GitHub's visible content.
    sub_filter '<head>' '<head><script src="/static/github-hook.js"></script>';
  
    proxy_redirect ~*^https?://(?:www\.)?github\.com/(.*)$ https://github.gohj99.site/$1;
    proxy_redirect ~*^https?://api\.github\.com/(.*)$ https://api.github.gohj99.site/$1;
    proxy_redirect ~*^https?://raw\.githubusercontent\.com/(.*)$ https://raw.github.gohj99.site/$1;
    proxy_redirect ~*^https?://camo\.githubusercontent\.com/(.*)$ https://camo.github.gohj99.site/$1;
    proxy_redirect ~*^https?://docs\.github\.com/(.*)$ https://docs.github.gohj99.site/$1;
    proxy_redirect ~*^https?://gist\.github\.com/(.*)$ https://gist.github.gohj99.site/$1;
    proxy_redirect ~*^https?://github\.githubassets\.com/(.*)$ https://assets.github.gohj99.site/$1;
    proxy_redirect ~*^https?://avatars\.githubusercontent\.com/(.*)$ https://avatars.github.gohj99.site/$1;
    proxy_redirect ~*^https?://objects\.githubusercontent\.com/(.*)$ https://objects.github.gohj99.site/$1;
    proxy_redirect ~*^https?://codeload\.github\.com/(.*)$ https://codeload.github.gohj99.site/$1;
    proxy_redirect ~*^https?://ghcr\.io/(.*)$ https://ghcr.github.gohj99.site/$1;
    proxy_redirect ~*^https?://gist-assets\.githubusercontent\.com/(.*)$ https://gist-assets.github.gohj99.site/$1;
    proxy_redirect ~*^https?://user-images\.githubusercontent\.com/(.*)$ https://user-images.github.gohj99.site/$1;
    proxy_redirect ~*^https?://private-user-images\.githubusercontent\.com/(.*)$ https://private-user-images.github.gohj99.site/$1;
    proxy_redirect ~*^https?://release-assets\.githubusercontent\.com/(.*)$ https://release-assets.github.gohj99.site/$1;
    proxy_redirect ~*^https?://github-releases\.githubusercontent\.com/(.*)$ https://github-releases.github.gohj99.site/$1;
}

# Standalone Nginx/OpenResty configuration for github.gohj99.site.
#
# Before starting Nginx on a new server:
#   1. Copy github.gohj99.site/index to /var/www/github.gohj99.site/index.
#   2. Create /var/cache/nginx/ghproxy/static and /var/cache/nginx/ghproxy/dynamic
#      and make them writable by the worker user (www-data below).
#   3. Put a certificate covering every proxy hostname at:
#      /var/www/github.gohj99.site/ssl/fullchain.pem
#      /var/www/github.gohj99.site/ssl/privkey.pem
#   4. Install an Nginx build with http_ssl_module, http_proxy_module,
#      http_sub_module, http_realip_module and http_stub_status/cache support.
#      Debian/Ubuntu users can use nginx-extras; OpenResty includes these modules.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
worker_rlimit_nofile 65535;

# Debian/Ubuntu load dynamic modules from this directory. The wildcard is
# harmless on installations that do not ship the directory.
include /etc/nginx/modules-enabled/*.conf;

events {
    use epoll;
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 5000;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 2;
    gzip_vary on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/javascript application/xml
               application/xml+rss image/svg+xml;

    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;

    # Trust forwarded client IPs only from a local reverse proxy. If a CDN is
    # placed in front of this server, add only that provider's published CIDRs.
    real_ip_recursive on;
    real_ip_header X-Forwarded-For;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;

    # Disk caches. The directories must exist before nginx -t/startup.
    proxy_cache_path /var/cache/nginx/ghproxy/static
        levels=1:2
        keys_zone=gh_static_cache:50m
        inactive=7d
        max_size=10g
        use_temp_path=off;
    proxy_cache_path /var/cache/nginx/ghproxy/dynamic
        levels=1:2
        keys_zone=gh_dynamic_cache:50m
        inactive=1d
        max_size=2g
        use_temp_path=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Gist pages and raw Gist files use different upstreams.
    map $uri $gh_gist_backend {
        ~^/[^/]+/[^/]+/raw/ https://gist.githubusercontent.com;
        default             https://gist.github.com;
    }

    map $uri $gh_gist_backend_host {
        ~^/[^/]+/[^/]+/raw/ gist.githubusercontent.com;
        default             gist.github.com;
    }

    # Upstream URL selected by the requested proxy hostname.
    map $host $gh_backend {
        github.gohj99.site                     https://github.com;
        api.github.gohj99.site                 https://api.github.com;
        raw.github.gohj99.site                 https://raw.githubusercontent.com;
        camo.github.gohj99.site                https://camo.githubusercontent.com;
        docs.github.gohj99.site                https://docs.github.com;
        gist.github.gohj99.site                $gh_gist_backend;
        assets.github.gohj99.site              https://github.githubassets.com;
        avatars.github.gohj99.site             https://avatars.githubusercontent.com;
        objects.github.gohj99.site             https://objects.githubusercontent.com;
        codeload.github.gohj99.site            https://codeload.github.com;
        ghcr.github.gohj99.site                https://ghcr.io;
        gist-assets.github.gohj99.site         https://gist-assets.githubusercontent.com;
        user-images.github.gohj99.site         https://user-images.githubusercontent.com;
        private-user-images.github.gohj99.site https://private-user-images.githubusercontent.com;
        release-assets.github.gohj99.site      https://release-assets.githubusercontent.com;
        github-releases.github.gohj99.site     https://github-releases.githubusercontent.com;
        default                                https://github.com;
    }

    # Upstream Host/SNI selected by the requested proxy hostname.
    map $host $gh_backend_host {
        github.gohj99.site                     github.com;
        api.github.gohj99.site                 api.github.com;
        raw.github.gohj99.site                 raw.githubusercontent.com;
        camo.github.gohj99.site                camo.githubusercontent.com;
        docs.github.gohj99.site                docs.github.com;
        gist.github.gohj99.site                $gh_gist_backend_host;
        assets.github.gohj99.site              github.githubassets.com;
        avatars.github.gohj99.site             avatars.githubusercontent.com;
        objects.github.gohj99.site             objects.githubusercontent.com;
        codeload.github.gohj99.site            codeload.github.com;
        ghcr.github.gohj99.site                ghcr.io;
        gist-assets.github.gohj99.site         gist-assets.githubusercontent.com;
        user-images.github.gohj99.site         user-images.githubusercontent.com;
        private-user-images.github.gohj99.site private-user-images.githubusercontent.com;
        release-assets.github.gohj99.site      release-assets.githubusercontent.com;
        github-releases.github.gohj99.site     github-releases.githubusercontent.com;
        default                                github.com;
    }

    # Only API and GHCR receive credentials. Other hosts deliberately drop
    # Authorization/Cookie so an accidental browser cookie is not forwarded.
    map $host $gh_authorization {
        api.github.gohj99.site  $http_authorization;
        ghcr.github.gohj99.site $http_authorization;
        default                 "";
    }

    map $host $gh_cookie {
        api.github.gohj99.site $http_cookie;
        default                "";
    }

    map $http_authorization $gh_has_authorization {
        default 1;
        ""      0;
    }

    map $http_cookie $gh_has_cookie {
        default 1;
        ""      0;
    }

    map $host $gh_cache_zone {
        raw.github.gohj99.site                  gh_static_cache;
        camo.github.gohj99.site                 gh_static_cache;
        assets.github.gohj99.site               gh_static_cache;
        avatars.github.gohj99.site              gh_static_cache;
        objects.github.gohj99.site              gh_static_cache;
        codeload.github.gohj99.site             gh_static_cache;
        gist-assets.github.gohj99.site          gh_static_cache;
        user-images.github.gohj99.site          gh_static_cache;
        private-user-images.github.gohj99.site  gh_static_cache;
        release-assets.github.gohj99.site       gh_static_cache;
        github-releases.github.gohj99.site      gh_static_cache;
        github.gohj99.site                      gh_dynamic_cache;
        api.github.gohj99.site                  gh_dynamic_cache;
        docs.github.gohj99.site                 gh_dynamic_cache;
        gist.github.gohj99.site                 gh_dynamic_cache;
        ghcr.github.gohj99.site                 gh_dynamic_cache;
        default                                 gh_dynamic_cache;
    }

    # Requests carrying credentials must never be served from cache.
    map $host:$gh_has_authorization:$gh_has_cookie $gh_api_skip_cache {
        default 0;
        ~^api\.github\.gohj99\.site:1:[01]$ 1;
        ~^api\.github\.gohj99\.site:[01]:1$ 1;
        ~^ghcr\.github\.gohj99\.site:1:[01]$ 1;
    }

    # Signed object URLs and mutable archive refs must never be cached.
    map $args $gh_has_signed_query {
        default 0;
        ~*(^|&)(X-Amz-Algorithm|X-Amz-Credential|X-Amz-Date|X-Amz-Expires|X-Amz-Signature|X-Amz-SignedHeaders)= 1;
    }

    map $uri $gh_is_mutable_codeload_ref {
        default 0;
        ~^/[^/]+/[^/]+/(?:zip|tar\.gz|legacy\.zip|legacy\.tar\.gz)/refs/ 1;
    }

    map $host:$gh_has_signed_query:$gh_is_mutable_codeload_ref $gh_skip_risky_cache {
        default 0;
        ~^gist\.github\.gohj99\.site: 1;
        ~^objects\.github\.gohj99\.site:1:0$ 1;
        ~^codeload\.github\.gohj99\.site:[01]:1$ 1;
    }

    # Only the main host serves a local homepage at /.
    map $host $gh_homepage_file {
        default             /__gohj99_no_homepage__.html;
        github.gohj99.site  /index.html;
    }

    # Prevent an SNI-matched but Host-spoofed request from selecting the
    # default GitHub upstream.
    map $host $gh_allowed_host {
        default 0;
        github.gohj99.site                     1;
        api.github.gohj99.site                 1;
        raw.github.gohj99.site                 1;
        camo.github.gohj99.site                1;
        docs.github.gohj99.site                1;
        gist.github.gohj99.site                1;
        assets.github.gohj99.site              1;
        avatars.github.gohj99.site             1;
        objects.github.gohj99.site             1;
        codeload.github.gohj99.site            1;
        ghcr.github.gohj99.site                1;
        gist-assets.github.gohj99.site         1;
        user-images.github.gohj99.site         1;
        private-user-images.github.gohj99.site 1;
        release-assets.github.gohj99.site      1;
        github-releases.github.gohj99.site     1;
    }

    # Smart URL redirect: /https://github.com/user/repo -> proxy hostname.
    map $uri $gh_redirect_subdomain {
        default "";
        ~^/https?://(?:www\.)?github\.com(?:/|$) github.gohj99.site;
        ~^/https?://api\.github\.com(?:/|$) api.github.gohj99.site;
        ~^/https?://raw\.githubusercontent\.com(?:/|$) raw.github.gohj99.site;
        ~^/https?://camo\.githubusercontent\.com(?:/|$) camo.github.gohj99.site;
        ~^/https?://docs\.github\.com(?:/|$) docs.github.gohj99.site;
        ~^/https?://gist\.github\.com(?:/|$) gist.github.gohj99.site;
        ~^/https?://ghcr\.io(?:/|$) ghcr.github.gohj99.site;
        ~^/https?://github\.githubassets\.com(?:/|$) assets.github.gohj99.site;
        ~^/https?://avatars\.githubusercontent\.com(?:/|$) avatars.github.gohj99.site;
        ~^/https?://objects\.githubusercontent\.com(?:/|$) objects.github.gohj99.site;
        ~^/https?://codeload\.github\.com(?:/|$) codeload.github.gohj99.site;
        ~^/https?://gist-assets\.githubusercontent\.com(?:/|$) gist-assets.github.gohj99.site;
        ~^/https?://user-images\.githubusercontent\.com(?:/|$) user-images.github.gohj99.site;
        ~^/https?://private-user-images\.githubusercontent\.com(?:/|$) private-user-images.github.gohj99.site;
        ~^/https?://release-assets\.githubusercontent\.com(?:/|$) release-assets.github.gohj99.site;
        ~^/https?://github-releases\.githubusercontent\.com(?:/|$) github-releases.gohj99.site;
    }

    # HTTP catch-all: do not proxy unknown Host values.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/github.gohj99.site/index;
            try_files $uri =404;
        }

        location / {
            return 301 https://github.gohj99.site$request_uri;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name github.gohj99.site api.github.gohj99.site raw.github.gohj99.site
                    camo.github.gohj99.site docs.github.gohj99.site gist.github.gohj99.site
                    assets.github.gohj99.site avatars.github.gohj99.site objects.github.gohj99.site
                    codeload.github.gohj99.site ghcr.github.gohj99.site gist-assets.github.gohj99.site
                    user-images.github.gohj99.site private-user-images.github.gohj99.site
                    release-assets.github.gohj99.site github-releases.github.gohj99.site;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/github.gohj99.site/index;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # TLS catch-all. It is deliberately separate from the proxy server so an
    # unknown SNI/Host cannot become a public GitHub proxy.
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        ssl_certificate /var/www/github.gohj99.site/ssl/fullchain.pem;
        ssl_certificate_key /var/www/github.gohj99.site/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        return 444;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name github.gohj99.site api.github.gohj99.site raw.github.gohj99.site
                    camo.github.gohj99.site docs.github.gohj99.site gist.github.gohj99.site
                    assets.github.gohj99.site avatars.github.gohj99.site objects.github.gohj99.site
                    codeload.github.gohj99.site ghcr.github.gohj99.site gist-assets.github.gohj99.site
                    user-images.github.gohj99.site private-user-images.github.gohj99.site
                    release-assets.github.gohj99.site github-releases.github.gohj99.site;

        root /var/www/github.gohj99.site/index;
        index index.html;
        access_log /var/log/nginx/github.gohj99.site.access.log main;
        error_log /var/log/nginx/github.gohj99.site.error.log warn;

        ssl_certificate /var/www/github.gohj99.site/ssl/fullchain.pem;
        ssl_certificate_key /var/www/github.gohj99.site/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_prefer_server_ciphers off;

        if ($gh_allowed_host = 0) {
            return 444;
        }

        error_page 497 https://$host$request_uri;
        add_header Strict-Transport-Security "max-age=31536000" always;
        limit_conn perserver 1500;
        limit_conn perip 50;
        limit_rate 2048k;

        location ~* ^/(?:\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime|vendor|__pycache__)(?:/|$) {
            return 404;
        }

        location ~* ^/(login|signup|session|logout|settings|account|notifications|new|import|authorize|organizations/plan|marketplace)(?:/|$) {
            return 404;
        }

        location ~* (^|/)proxy_cache_dir(?:/|$) {
            return 403;
        }

        location ^~ /.well-known/acme-challenge/ {
            allow all;
            try_files $uri =404;
        }

        location ~ ^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$ {
            return 403;
        }

        location = / {
            try_files $gh_homepage_file @ghfast_backend;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
        }

        location = /favicon.ico {
            try_files $uri @ghfast_backend;
            access_log off;
            log_not_found off;
        }

        location = /robots.txt {
            try_files $uri @ghfast_backend;
            access_log off;
        }

        location = /static/content-blocked.html {
            try_files $uri @ghfast_backend;
            access_log off;
        }

        location = /static/github-hook.js {
            try_files $uri @ghfast_backend;
            access_log off;
        }

        location ~ ^/https?://[^/]+(/.*)?$ {
            if ($gh_redirect_subdomain = "") {
                return 404;
            }
            return 301 https://$gh_redirect_subdomain$1$is_args$args;
        }

        location / {
            try_files $uri $uri/ @ghfast_backend;
        }

        location @ghfast_backend {
            resolver 1.1.1.1 8.8.8.8 valid=300s;
            resolver_timeout 10s;

            proxy_pass $gh_backend;
            proxy_set_header Host $gh_backend_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_http_version 1.1;

            proxy_set_header Authorization $gh_authorization;
            proxy_set_header Cookie $gh_cookie;
            proxy_set_header Accept-Encoding "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffer_size 256k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 512k;
            proxy_temp_file_write_size 512k;

            proxy_ssl_server_name on;
            proxy_ssl_name $gh_backend_host;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

            proxy_cache $gh_cache_zone;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$host$uri$is_args$args";
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_bypass $gh_skip_risky_cache $gh_api_skip_cache;
            proxy_no_cache $gh_skip_risky_cache $gh_api_skip_cache;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_revalidate on;
            proxy_cache_background_update on;
            proxy_cache_valid 200 206 10m;
            proxy_cache_valid 301 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_valid 403 30s;
            proxy_cache_valid 500 502 503 504 0;

            add_header X-Cache $upstream_cache_status always;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Content-Security-Policy-Report-Only;
            proxy_hide_header Server;
            proxy_hide_header X-GitHub-Request-Id;

            add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; img-src * data: blob:; style-src 'unsafe-inline' 'self' https:; script-src 'unsafe-inline' 'unsafe-eval' 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

            sub_filter_once off;
            sub_filter_types text/css application/javascript application/json;
            sub_filter "github.com" "github.gohj99.site";
            sub_filter "api.github.com" "api.github.gohj99.site";
            sub_filter "raw.githubusercontent.com" "raw.github.gohj99.site";
            sub_filter "camo.githubusercontent.com" "camo.github.gohj99.site";
            sub_filter "docs.github.com" "docs.github.gohj99.site";
            sub_filter "gist.github.com" "gist.github.gohj99.site";
            sub_filter "github.githubassets.com" "assets.github.gohj99.site";
            sub_filter "avatars.githubusercontent.com" "avatars.github.gohj99.site";
            sub_filter "objects.githubusercontent.com" "objects.github.gohj99.site";
            sub_filter "codeload.github.com" "codeload.github.gohj99.site";
            sub_filter "ghcr.io" "ghcr.github.gohj99.site";
            sub_filter "gist-assets.githubusercontent.com" "gist-assets.github.gohj99.site";
            sub_filter "user-images.githubusercontent.com" "user-images.github.gohj99.site";
            sub_filter "private-user-images.githubusercontent.com" "private-user-images.github.gohj99.site";
            sub_filter "release-assets.githubusercontent.com" "release-assets.github.gohj99.site";
            sub_filter "github-releases.githubusercontent.com" "github-releases.github.gohj99.site";
            sub_filter '<head>' '<head><script src="/static/github-hook.js"></script>';

            proxy_redirect ~*^https?://(?:www\.)?github\.com/(.*)$ https://github.gohj99.site/$1;
            proxy_redirect ~*^https?://api\.github\.com/(.*)$ https://api.github.gohj99.site/$1;
            proxy_redirect ~*^https?://raw\.githubusercontent\.com/(.*)$ https://raw.github.gohj99.site/$1;
            proxy_redirect ~*^https?://camo\.githubusercontent\.com/(.*)$ https://camo.github.gohj99.site/$1;
            proxy_redirect ~*^https?://docs\.github\.com/(.*)$ https://docs.github.gohj99.site/$1;
            proxy_redirect ~*^https?://gist\.github\.com/(.*)$ https://gist.github.gohj99.site/$1;
            proxy_redirect ~*^https?://github\.githubassets\.com/(.*)$ https://assets.github.gohj99.site/$1;
            proxy_redirect ~*^https?://avatars\.githubusercontent\.com/(.*)$ https://avatars.github.gohj99.site/$1;
            proxy_redirect ~*^https?://objects\.githubusercontent\.com/(.*)$ https://objects.github.gohj99.site/$1;
            proxy_redirect ~*^https?://codeload\.github\.com/(.*)$ https://codeload.github.gohj99.site/$1;
            proxy_redirect ~*^https?://ghcr\.io/(.*)$ https://ghcr.github.gohj99.site/$1;
            proxy_redirect ~*^https?://gist-assets\.githubusercontent\.com/(.*)$ https://gist-assets.github.gohj99.site/$1;
            proxy_redirect ~*^https?://user-images\.githubusercontent\.com/(.*)$ https://user-images.github.gohj99.site/$1;
            proxy_redirect ~*^https?://private-user-images\.githubusercontent\.com/(.*)$ https://private-user-images.github.gohj99.site/$1;
            proxy_redirect ~*^https?://release-assets\.githubusercontent\.com/(.*)$ https://release-assets.github.gohj99.site/$1;
            proxy_redirect ~*^https?://github-releases\.githubusercontent\.com/(.*)$ https://github-releases.github.gohj99.site/$1;
        }
    }
}

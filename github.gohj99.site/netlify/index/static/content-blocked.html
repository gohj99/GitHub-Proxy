<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>此页面无法访问</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        background: #f6f8fa;
        color: #1f2328;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .message { width: min(520px, 100%); text-align: center; }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #cf222e;
        color: #fff;
        font-size: 28px;
        font-weight: 700;
        line-height: 1;
      }
      h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.35; font-weight: 600; }
      p { margin: 0; color: #59636e; font-size: 15px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main class="message" role="alert" aria-live="assertive">
      <div class="icon" aria-hidden="true">!</div>
      <h1>此页面无法访问</h1>
      <p>页面内容不符合本站内容安全规则。</p>
    </main>
  </body>
</html>

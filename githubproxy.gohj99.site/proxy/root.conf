# githubproxy.gohj99.site - entry/redirect site configuration
# Include this file inside the existing `server {}` block.
# This is proxy-only configuration: the site's root/index/404/static-file
# settings remain in the panel-generated site configuration.

# The entry site is intentionally a closed redirector. Only known GitHub
# origins are accepted, so this cannot be abused as an open redirect.
#
# `$gh_target_path` is captured without the request query string. Nginx keeps
# the original query in `$args`, allowing links such as /releases?... to be
# forwarded unchanged.
# Nginx normally merges consecutive slashes (`https://` can arrive as
# `https:/` during URI normalization), so accept one or two slashes here.
location ~* ^/https?://?(?<gh_target_host>[^/?#:]+)(?::\d+)?(?<gh_target_path>/.*)?$ {
    # Copy the location captures before the `if` regexes run. This avoids
    # depending on Nginx's internal capture slots while evaluating mappings.
    set $gh_request_host $gh_target_host;
    set $gh_request_path $gh_target_path;
    set $gh_target_subdomain "";

    if ($gh_request_host ~* ^(?:www\.)?github\.com$) {
        set $gh_target_subdomain "github.gohj99.site";
    }
    if ($gh_request_host ~* ^api\.github\.com$) {
        set $gh_target_subdomain "api.github.gohj99.site";
    }
    if ($gh_request_host ~* ^raw\.githubusercontent\.com$) {
        set $gh_target_subdomain "raw.github.gohj99.site";
    }
    if ($gh_request_host ~* ^camo\.githubusercontent\.com$) {
        set $gh_target_subdomain "camo.github.gohj99.site";
    }
    if ($gh_request_host ~* ^docs\.github\.com$) {
        set $gh_target_subdomain "docs.github.gohj99.site";
    }
    if ($gh_request_host ~* ^gist\.github\.com$) {
        set $gh_target_subdomain "gist.github.gohj99.site";
    }
    if ($gh_request_host ~* ^github\.githubassets\.com$) {
        set $gh_target_subdomain "assets.github.gohj99.site";
    }
    if ($gh_request_host ~* ^avatars\.githubusercontent\.com$) {
        set $gh_target_subdomain "avatars.github.gohj99.site";
    }
    if ($gh_request_host ~* ^objects\.githubusercontent\.com$) {
        set $gh_target_subdomain "objects.github.gohj99.site";
    }
    if ($gh_request_host ~* ^codeload\.github\.com$) {
        set $gh_target_subdomain "codeload.github.gohj99.site";
    }
    if ($gh_request_host ~* ^ghcr\.io$) {
        set $gh_target_subdomain "ghcr.github.gohj99.site";
    }
    if ($gh_request_host ~* ^gist-assets\.githubusercontent\.com$) {
        set $gh_target_subdomain "gist-assets.github.gohj99.site";
    }
    if ($gh_request_host ~* ^user-images\.githubusercontent\.com$) {
        set $gh_target_subdomain "user-images.github.gohj99.site";
    }
    if ($gh_request_host ~* ^private-user-images\.githubusercontent\.com$) {
        set $gh_target_subdomain "private-user-images.github.gohj99.site";
    }
    if ($gh_request_host ~* ^release-assets\.githubusercontent\.com$) {
        set $gh_target_subdomain "release-assets.github.gohj99.site";
    }
    if ($gh_request_host ~* ^github-releases\.githubusercontent\.com$) {
        set $gh_target_subdomain "github-releases.github.gohj99.site";
    }

    if ($gh_target_subdomain = "") {
        return 404;
    }

    return 301 https://$gh_target_subdomain$gh_request_path$is_args$args;
}
